<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartPark - Tamil Nadu Parking Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #111827;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #ffffff;
            padding: 20px 40px;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;

            background: #2563eb;
            color: white;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
            font-weight: 700;
        }

        .brand-name {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #111827;
        }

        .brand-tagline {
            color: #6b7280;
            font-size: 13px;
            margin-top: 3px;
        }

        /* =========================
           SEARCH SECTION
        ========================= */

        .search-section {
            background: #ffffff;
            padding: 22px 28px;
            border-bottom: 1px solid #e5e7eb;
        }

        .search-container {
            max-width: 1100px;
            margin: auto;

            display: flex;
            gap: 10px;
        }

        #searchInput {
            flex: 1;

            padding: 14px 16px;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            font-size: 16px;
            outline: none;

            transition: 0.2s;
        }

        #searchInput:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        #searchBtn {
            padding: 14px 26px;

            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            cursor: pointer;

            font-size: 15px;
            font-weight: 600;

            transition: 0.2s;
        }

        #searchBtn:hover {
            background: #1d4ed8;
        }

        #searchBtn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        /* =========================
           STATUS
        ========================= */

        #status {
            max-width: 1100px;

            margin: 0 auto;

            padding-top: 12px;

            color: #6b7280;

            font-size: 14px;
        }

        /* =========================
           MAP
        ========================= */

        #map {
            height: 600px;
            width: 100%;
        }

        /* =========================
           POPUP
        ========================= */

        .parking-popup {
            min-width: 190px;
            font-size: 14px;
        }

        .parking-popup h3 {
            margin: 0 0 8px;

            color: #111827;

            font-size: 16px;
        }

        .parking-popup p {
            margin: 5px 0 12px;

            color: #6b7280;
        }

        .direction-btn {
            border: none;

            background: #2563eb;
            color: white;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 13px;
            font-weight: 600;
        }

        .direction-btn:hover {
            background: #1d4ed8;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                padding: 16px 20px;
            }

            .brand-name {
                font-size: 22px;
            }

            .brand-tagline {
                font-size: 11px;
            }

            .search-section {
                padding: 16px;
            }

            .search-container {
                flex-direction: column;
            }

            #searchBtn {
                width: 100%;
            }

            #map {
                height: 500px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="brand">

            <div class="brand-icon">
                P
            </div>

            <div>

                <div class="brand-name">
                    SmartPark
                </div>

                <div class="brand-tagline">
                    Smart Parking Management
                </div>

            </div>

        </div>

    </header>


    <!-- =========================
         SEARCH
    ========================= -->

    <section class="search-section">

        <div class="search-container">

            <input
                type="text"
                id="searchInput"
                placeholder="Search street, area or city in Tamil Nadu..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>


        <div id="status">
            Search for a street, area or city in Tamil Nadu.
        </div>

    </section>


    <!-- =========================
         MAP
    ========================= -->

    <div id="map"></div>


    <!-- =========================
         LEAFLET JS
    ========================= -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <script>


        // =====================================================
        // TAMIL NADU BOUNDARIES
        // =====================================================

        const tamilNaduBounds = L.latLngBounds(

            [7.9, 76.9],

            [13.6, 80.5]

        );


        // =====================================================
        // MAP INITIALIZATION
        // =====================================================

        const map = L.map("map", {

            maxBounds: tamilNaduBounds,

            maxBoundsViscosity: 1.0,

            minZoom: 6

        });


        // =====================================================
        // INITIAL MAP VIEW
        // =====================================================

        map.fitBounds(tamilNaduBounds);


        // =====================================================
        // OPENSTREETMAP MAP
        // =====================================================

        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                attribution:
                    "&copy; OpenStreetMap contributors",

                maxZoom: 19

            }

        ).addTo(map);


        // =====================================================
        // PARKING MARKER LAYER
        // =====================================================

        const parkingLayer =
            L.layerGroup().addTo(map);


        // =====================================================
        // SEARCH LOCATION
        // =====================================================

        async function searchLocation() {


            const input =
                document.getElementById(
                    "searchInput"
                );


            const searchBtn =
                document.getElementById(
                    "searchBtn"
                );


            const status =
                document.getElementById(
                    "status"
                );


            const searchText =
                input.value.trim();


            // -------------------------------------------------
            // EMPTY SEARCH
            // -------------------------------------------------

            if (!searchText) {

                status.textContent =
                    "Please enter a location.";

                return;

            }


            // -------------------------------------------------
            // LOADING
            // -------------------------------------------------

            searchBtn.disabled = true;

            searchBtn.textContent =
                "Searching...";

            status.textContent =
                "Finding location in Tamil Nadu...";


            try {


                // =================================================
                // NOMINATIM SEARCH
                // =================================================

                const url =

                    "https://nominatim.openstreetmap.org/search" +

                    "?format=json" +

                    "&addressdetails=1" +

                    "&limit=5" +

                    "&countrycodes=in" +

                    "&viewbox=76.9,13.6,80.5,7.9" +

                    "&bounded=1" +

                    "&q=" +

                    encodeURIComponent(
                        searchText +
                        ", Tamil Nadu, India"
                    );


                const response =
                    await fetch(url, {

                        headers: {

                            "Accept-Language":
                                "en",

                            "User-Agent":
                                "SmartPark-College-Project"

                        }

                    });


                if (!response.ok) {

                    throw new Error(
                        "Location search failed"
                    );

                }


                const data =
                    await response.json();


                // =================================================
                // NO RESULTS
                // =================================================

                if (!data.length) {

                    status.textContent =
                        "Location not found in Tamil Nadu. Try adding the area or city name.";

                    return;

                }


                // =================================================
                // FIND A VALID TAMIL NADU RESULT
                // =================================================

                let result = null;


                for (
                    const item of data
                ) {


                    const address =
                        item.address || {};


                    const state =
                        (
                            address.state ||
                            ""
                        ).toLowerCase();


                    const country =
                        (
                            address.country ||
                            ""
                        ).toLowerCase();


                    const displayName =
                        (
                            item.display_name ||
                            ""
                        ).toLowerCase();


                    const isTamilNadu =

                        state.includes(
                            "tamil nadu"
                        )

                        ||

                        displayName.includes(
                            "tamil nadu"
                        );


                    const isIndia =

                        country.includes(
                            "india"
                        )

                        ||

                        displayName.includes(
                            "india"
                        );


                    if (
                        isTamilNadu &&
                        isIndia
                    ) {

                        result = item;

                        break;

                    }

                }


                // =================================================
                // INVALID RESULT
                // =================================================

                if (!result) {

                    status.textContent =
                        "Please enter a location inside Tamil Nadu.";

                    return;

                }


                // =================================================
                // GET COORDINATES
                // =================================================

                const latitude =
                    parseFloat(
                        result.lat
                    );


                const longitude =
                    parseFloat(
                        result.lon
                    );


                // =================================================
                // EXTRA SAFETY CHECK
                // =================================================

                if (
                    !tamilNaduBounds.contains(
                        [latitude, longitude]
                    )
                ) {

                    status.textContent =
                        "This location is outside Tamil Nadu.";

                    return;

                }


                // =================================================
                // MOVE MAP
                // =================================================

                map.setView(

                    [
                        latitude,
                        longitude
                    ],

                    16

                );


                // =================================================
                // REMOVE OLD PARKING MARKERS
                // =================================================

                parkingLayer.clearLayers();


                // =================================================
                // CREATE SEARCH MARKER
                // =================================================

                const searchMarker =
                    L.marker(
                        [
                            latitude,
                            longitude
                        ]
                    )
                    .addTo(
                        parkingLayer
                    );


                // =================================================
                // READABLE ADDRESS
                // =================================================

                const readableAddress =
                    getReadableAddress(
                        result
                    );


                searchMarker.bindPopup(

                    `
                    <div>

                        <strong>
                            📍 Location
                        </strong>

                        <br><br>

                        ${escapeHtml(
                            readableAddress
                        )}

                    </div>
                    `

                ).openPopup();


                // =================================================
                // STATUS
                // =================================================

                status.textContent =
                    "Location found. Searching for nearby parking...";


                // =================================================
                // FIND PARKING
                // =================================================

                await findNearbyParking(

                    latitude,

                    longitude

                );


            }

            catch (error) {

                console.error(
                    error
                );


                status.textContent =
                    "Unable to search this location. Please try again.";

            }


            finally {

                searchBtn.disabled =
                    false;

                searchBtn.textContent =
                    "Search";

            }

        }


        // =====================================================
        // READABLE ADDRESS
        // =====================================================

        function getReadableAddress(
            result
        ) {


            const address =
                result.address || {};


            const parts = [];


            // STREET
            if (
                address.road
            ) {

                parts.push(
                    address.road
                );

            }


            // NEIGHBOURHOOD
            if (
                address.neighbourhood
            ) {

                parts.push(
                    address.neighbourhood
                );

            }


            // SUBURB
            else if (
                address.suburb
            ) {

                parts.push(
                    address.suburb
                );

            }


            // CITY
            if (
                address.city
            ) {

                parts.push(
                    address.city
                );

            }

            else if (
                address.town
            ) {

                parts.push(
                    address.town
                );

            }

            else if (
                address.village
            ) {

                parts.push(
                    address.village
                );

            }


            // DISTRICT
            if (
                address.state_district
            ) {

                parts.push(
                    address.state_district
                );

            }


            // STATE
            if (
                address.state
            ) {

                parts.push(
                    address.state
                );

            }


            // COUNTRY
            if (
                address.country
            ) {

                parts.push(
                    address.country
                );

            }


            // FALLBACK
            if (
                parts.length === 0
            ) {

                return result.display_name ||
                    "Location found";

            }


            return parts.join(
                ", "
            );

        }


        // =====================================================
        // FIND NEARBY PARKING
        // =====================================================

        async function findNearbyParking(

            latitude,

            longitude

        ) {


            const radius = 3000;


            // =================================================
            // OVERPASS QUERY
            // =================================================

            const query = `

                [out:json];

                (

                    node
                    ["amenity"="parking"]
                    (around:${radius},${latitude},${longitude});

                    way
                    ["amenity"="parking"]
                    (around:${radius},${latitude},${longitude});

                );

                out center;

            `;


            try {


                const response =

                    await fetch(

                        "https://overpass-api.de/api/interpreter",

                        {

                            method: "POST",

                            body:
                                new URLSearchParams({

                                    data:
                                        query

                                })

                        }

                    );


                if (!response.ok) {

                    throw new Error(
                        "Parking search failed"
                    );

                }


                const data =
                    await response.json();


                let parkingCount = 0;


                // =================================================
                // DISPLAY PARKING
                // =================================================

                data.elements.forEach(

                    parking => {


                        let lat;

                        let lon;


                        // -------------------------------------------------
                        // NODE
                        // -------------------------------------------------

                        if (
                            parking.type ===
                            "node"
                        ) {

                            lat =
                                parking.lat;

                            lon =
                                parking.lon;

                        }


                        // -------------------------------------------------
                        // WAY
                        // -------------------------------------------------

                        else if (
                            parking.center
                        ) {

                            lat =
                                parking.center.lat;

                            lon =
                                parking.center.lon;

                        }


                        // -------------------------------------------------
                        // INVALID
                        // -------------------------------------------------

                        if (
                            lat === undefined ||
                            lon === undefined
                        ) {

                            return;

                        }


                        // -------------------------------------------------
                        // TAMIL NADU ONLY
                        // -------------------------------------------------

                        if (
                            !tamilNaduBounds.contains(
                                [
                                    lat,
                                    lon
                                ]
                            )
                        ) {

                            return;

                        }


                        // -------------------------------------------------
                        // PARKING NAME
                        // -------------------------------------------------

                        const name =

                            parking.tags?.name ||

                            "Parking Area";


                        // -------------------------------------------------
                        // CAPACITY
                        // -------------------------------------------------

                        const capacity =

                            parking.tags?.capacity ||

                            "Not available";


                        // -------------------------------------------------
                        // CREATE MARKER
                        // -------------------------------------------------

                        L.marker(

                            [
                                lat,
                                lon
                            ]

                        )

                        .addTo(
                            parkingLayer
                        )

                        .bindPopup(

                            `

                            <div class="parking-popup">

                                <h3>
                                    ${escapeHtml(
                                        name
                                    )}
                                </h3>


                                <p>
                                    🚗 Parking location
                                </p>


                                <p>

                                    Capacity:

                                    ${escapeHtml(
                                        String(
                                            capacity
                                        )
                                    )}

                                </p>


                                <button

                                    class="direction-btn"

                                    onclick="
                                        openDirections(
                                            ${lat},
                                            ${lon}
                                        )
                                    "

                                >

                                    Get Directions

                                </button>

                            </div>

                            `

                        );


                        parkingCount++;

                    }

                );


                // =================================================
                // STATUS
                // =================================================

                const status =
                    document.getElementById(
                        "status"
                    );


                if (
                    parkingCount === 0
                ) {

                    status.textContent =
                        "Location found, but no mapped parking locations were found nearby.";

                }

                else {

                    status.textContent =

                        parkingCount +

                        " parking locations found nearby.";

                }


            }

            catch (error) {


                console.error(
                    error
                );


                document.getElementById(
                    "status"
                ).textContent =

                    "Location found, but nearby parking could not be loaded.";

            }

        }


        // =====================================================
        // GET DIRECTIONS
        // =====================================================

        function openDirections(

            latitude,

            longitude

        ) {


            const url =

                `https://www.openstreetmap.org/directions?` +

                `engine=fossgis_osrm_car&route=` +

                `${latitude},${longitude}`;


            window.open(

                url,

                "_blank"

            );

        }


        // =====================================================
        // HTML ESCAPING
        // =====================================================

        function escapeHtml(
            value
        ) {


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // =====================================================
        // SEARCH BUTTON
        // =====================================================

        document

            .getElementById(
                "searchBtn"
            )

            .addEventListener(

                "click",

                searchLocation

            );


        // =====================================================
        // ENTER KEY
        // =====================================================

        document

            .getElementById(
                "searchInput"
            )

            .addEventListener(

                "keypress",

                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        searchLocation();

                    }

                }

            );


    </script>


</body>

</html>
